<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/status/theme.js"></script>
  <link rel="stylesheet" href="/status/theme.css" />
  <title>KAILA is under maintenance · KAILA</title>
  <style>
    :root {
      --primary: #1463ff;
      --accent: #27b7ff;
      --ink: #0a1220;
      --muted: #667085;
      --bg: #f7f9fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(39,183,255,0.16), transparent 32%),
        radial-gradient(circle at 88% 8%, rgba(20,99,255,0.12), transparent 28%),
        var(--bg);
    }
    main { max-width: 28rem; text-align: center; }
    img { width: 8rem; height: auto; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: rgba(20,99,255,0.1);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0.75rem 0; }
    p { color: var(--muted); line-height: 1.5; margin: 0; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 11rem;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.875rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .hint { margin-top: 1rem; font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <img class="wordmark-light" alt="KAILA" src="/brand/kaila-wordmark.png" width="176" height="40" />
    <img class="wordmark-dark" alt="" aria-hidden="true" src="/brand/kaila-wordmark-on-dark.png" width="176" height="40" />
    <div class="badge">503 Unavailable</div>
    <h1>KAILA is under maintenance</h1>
    <p>We are improving the marketplace. Please check back soon — your jobs and messages will be waiting.</p>
    <a href="/">Back home</a>
    <p class="hint">Local services near you — KAILA</p>
  </main>
</body>
</html>
