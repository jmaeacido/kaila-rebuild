# Local concurrent API server (replaces single-threaded `php artisan serve`).
# Start with: scripts/dev/start-api-apache.ps1

Define SRVROOT "C:/laragon/bin/apache/httpd-2.4.66-260223-Win64-VS18"
ServerRoot "${SRVROOT}"
Listen 127.0.0.1:8000
ServerName kaila-api.local
PidFile "C:/laragon/www/kaila/scripts/dev/runtime/httpd.pid"
ErrorLog "C:/laragon/www/kaila/scripts/dev/runtime/httpd-error.log"
CustomLog "C:/laragon/www/kaila/scripts/dev/runtime/httpd-access.log" common

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule php_module "C:/laragon/bin/php/php-8.3.30-Win32-vs16-x64/php8apache2_4.dll"

PHPIniDir "C:/laragon/bin/php/php-8.3.30-Win32-vs16-x64"
AddType application/x-httpd-php .php
DirectoryIndex index.php

LogFormat "%h %l %u %t \"%r\" %>s %b %D" common

DocumentRoot "C:/laragon/www/kaila/apps/api/public"

<Directory "C:/laragon/www/kaila/apps/api/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</Directory>
